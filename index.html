<meta charset="utf-8">
<title>MOSS AIR — 이끼 초음파 진단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* ============================================================
     MOSS AIR — 이끼 초음파 기반 상태 진단 (Desktop Web)
     모던 인포그래픽 / 화이트·딥그린 / 데스크톱 사이드바
     ============================================================ */
  :root{
    --bg:#F7F9F7; --surface:#FFFFFF; --surface-alt:#EEF3EE; --border:#DDE7E0; --divider:#EAEFEA;
    --primary:#1B5E3B; --primary-dark:#14472C; --secondary:#4CAF7A; --light:#EAF4EC;
    --ink:#1F2924; --muted:#68736D; --faint:#95A29B; --on-primary:#fff;
    --good:#1B5E3B; --good-tint:#E7F2EB; --caution:#C6801F; --caution-tint:#FaF0DE;
    --anomaly:#C0453B; --anomaly-tint:#F8E7E5; --neutral:#7A857F; --neutral-tint:#EDF1ED;
    --moss-1:#1B5E3B; --moss-2:#2F7D50; --moss-3:#4CAF7A; --moss-4:#84C89D;
    --moss-base-a:#CFE7D5; --moss-base-b:#A9D4B6; --moss-seta:#9FB08C; --moss-cap:#C8AA6C;
    --r:16px; --r-sm:10px; --r-lg:22px;
    --shadow:0 1px 2px rgba(20,40,30,.04),0 8px 22px rgba(20,40,30,.05);
    --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,'Apple SD Gothic Neo',monospace;
  }
  :root[data-theme="dark"]{
    --bg:#10150F; --surface:#171E17; --surface-alt:#1C271E; --border:#26312A; --divider:#202A22;
    --primary:#6FCB98; --primary-dark:#4CAF7A; --secondary:#4CAF7A; --light:#1C271E;
    --ink:#ECF2EC; --muted:#9DAAA0; --faint:#6B776E; --on-primary:#08110B;
    --good:#6FCB98; --good-tint:#17271C; --caution:#E0A254; --caution-tint:#2A2013;
    --anomaly:#E27469; --anomaly-tint:#2B1614; --neutral:#9DAAA0; --neutral-tint:#1C271E;
    --moss-1:#5FC08E; --moss-2:#4CAF7A; --moss-3:#72CD9A; --moss-4:#93DBB0;
    --moss-base-a:#23372A; --moss-base-b:#2E4636; --moss-seta:#6F7F5F; --moss-cap:#AC9159;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#10150F; --surface:#171E17; --surface-alt:#1C271E; --border:#26312A; --divider:#202A22;
    --primary:#6FCB98; --primary-dark:#4CAF7A; --secondary:#4CAF7A; --light:#1C271E;
    --ink:#ECF2EC; --muted:#9DAAA0; --faint:#6B776E; --on-primary:#08110B;
    --good:#6FCB98; --good-tint:#17271C; --caution:#E0A254; --caution-tint:#2A2013;
    --anomaly:#E27469; --anomaly-tint:#2B1614; --neutral:#9DAAA0; --neutral-tint:#1C271E;
    --moss-1:#5FC08E; --moss-2:#4CAF7A; --moss-3:#72CD9A; --moss-4:#93DBB0;
    --moss-base-a:#23372A; --moss-base-b:#2E4636; --moss-seta:#6F7F5F; --moss-cap:#AC9159;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.5}
  h1,h2,h3,p{margin:0} button{font-family:inherit;cursor:pointer}
  [hidden]{display:none!important}

  /* ---- Shell ---- */
  .shell{display:flex;min-height:100vh}
  .sidebar{width:236px;flex:none;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;gap:4px;transition:width .18s}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
  .brand .mark{width:36px;height:36px;border-radius:11px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
  .brand .mark svg{width:21px;height:21px}
  .brand .bt{font-size:16px;font-weight:700;letter-spacing:-.2px}.brand .bs{font-size:11px;color:var(--muted)}
  .navlink{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--muted);font-size:14px;font-weight:600;border:0;background:none;width:100%;text-align:left;transition:background .14s,color .14s}
  .navlink svg{width:20px;height:20px;flex:none}
  .navlink:hover{background:var(--surface-alt);color:var(--ink)}
  .navlink.active{background:var(--light);color:var(--primary)}
  .sidebar .spacer{flex:1}
  .side-foot{font-size:11px;color:var(--muted);padding:8px 10px;border:1px dashed var(--border);border-radius:10px;text-align:center}
  .collapse-btn{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:9px;padding:8px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:600}
  .content{flex:1;min-width:0;display:flex;flex-direction:column}
  .header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--divider);padding:14px 30px;display:flex;align-items:center;gap:16px}
  .header .htitle{font-size:15px;font-weight:700}
  .header .hspace{flex:1}
  .header .chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--border)}
  .header .chip .dot{width:8px;height:8px;border-radius:999px;background:var(--good)} .header .chip.err .dot{background:var(--anomaly)}
  .header .mode{font-size:11px;font-weight:700;letter-spacing:.3px;padding:5px 10px;border-radius:999px;background:var(--caution-tint);color:var(--caution)}
  .header .iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--ink);display:grid;place-items:center}
  .header .iconbtn svg{width:18px;height:18px}
  .main{flex:1;padding:26px 30px 70px}
  .inner{max-width:1200px;margin:0 auto}
  .page-title{font-size:24px;font-weight:700;letter-spacing:-.4px}
  .page-sub{font-size:13.5px;color:var(--muted);margin-top:3px}
  .sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
  .sec h2{font-size:15px;font-weight:700}.sec .hint{font-size:12px;color:var(--muted)}

  .grid{display:grid;gap:16px}
  .c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
  .card.pad{padding:20px}
  .metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
  .metric .lbl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:600}.metric .lbl svg{width:16px;height:16px}
  .metric .val{font-family:var(--mono);font-size:25px;font-weight:600;margin-top:8px;letter-spacing:-.5px}
  .metric .val .u{font-family:var(--font);font-size:12px;color:var(--muted);margin-left:4px}.metric .val .word{font-family:var(--font);font-size:17px}
  .metric .foot{margin-top:9px}

  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px}
  .badge .dot{width:8px;height:8px;border-radius:999px}
  .st-normal{color:var(--good);background:var(--good-tint)} .st-normal .dot{background:var(--good)}
  .st-caution{color:var(--caution);background:var(--caution-tint)} .st-caution .dot{background:var(--caution)}
  .st-anomaly{color:var(--anomaly);background:var(--anomaly-tint)} .st-anomaly .dot{background:var(--anomaly)}
  .st-insufficient{color:var(--neutral);background:var(--neutral-tint)} .st-insufficient .dot{background:var(--neutral)}

  /* ---- Moss Status Component (대표 UI) ---- */
  .moss-status{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:center;padding:26px 28px}
  @media(max-width:720px){.moss-status{grid-template-columns:1fr;text-align:center;justify-items:center}}
  .moss-visual{position:relative;display:inline-grid;place-items:center;line-height:0}
  .moss-visual>svg{width:100%;height:100%;display:block;overflow:visible}
  .moss-visual .mo-arc{transition:stroke-dashoffset .8s ease}
  .moss-visual.is-caution{filter:saturate(.7) brightness(.98)}
  .moss-visual.is-anomaly{filter:saturate(.48) brightness(.94)}
  .moss-visual.is-insufficient{filter:saturate(.25) brightness(.98) opacity(.9)}
  .moss-dot{position:absolute;top:5%;right:7%;width:12px;height:12px;border-radius:999px;box-shadow:0 0 0 3px var(--surface)}
  .ms-eyebrow{font-size:12.5px;color:var(--muted);font-weight:600}
  .ms-state{font-size:30px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
  .ms-msg{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.6;max-width:560px}
  .ms-grid{display:flex;gap:30px;flex-wrap:wrap;margin-top:18px}
  .ms-grid .k{font-size:12px;color:var(--muted)}.ms-grid .v{font-family:var(--mono);font-size:18px;font-weight:600;margin-top:3px}

  /* ---- Range bar ---- */
  .rb{position:relative;height:52px;margin-top:6px}
  .rb-track{position:absolute;top:22px;left:0;right:0;height:8px;border-radius:999px;background:var(--divider);overflow:hidden}
  .rb-normal{position:absolute;top:0;height:100%;background:var(--secondary);opacity:.5}
  .rb-mark{position:absolute;top:13px;width:3px;height:26px;border-radius:3px;background:var(--ink);transform:translateX(-50%)}
  .rb-dot{position:absolute;top:10px;width:16px;height:16px;border-radius:999px;border:3px solid var(--surface);transform:translateX(-50%);box-shadow:0 1px 4px rgba(0,0,0,.2)}
  .rb-cap{position:absolute;top:39px;font-size:10.5px;color:var(--faint);transform:translateX(-50%);white-space:nowrap;font-family:var(--mono)}
  .rb-ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:2px}

  /* ---- Measurement ---- */
  .measure-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 0}
  .moss-measure{position:relative;width:180px;height:180px;display:grid;place-items:center;margin:4px auto}
  .moss-measure .pulse{position:absolute;inset:4px;border-radius:999px;border:1.5px solid var(--secondary);opacity:0;pointer-events:none}
  .moss-measure.measuring .pulse{animation:mp 2.6s ease-out infinite}
  .moss-measure.measuring .pulse.p2{animation-delay:1.3s}
  @keyframes mp{0%{transform:scale(.72);opacity:.4}100%{transform:scale(1.26);opacity:0}}
  @media(prefers-reduced-motion:reduce){.moss-measure .pulse{animation:none!important;display:none}}
  .mbtn{margin-top:18px;min-height:52px;padding:0 26px;border-radius:14px;border:0;background:var(--primary);color:var(--on-primary);font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:9px}
  .mbtn.rec{background:var(--anomaly)}
  .mbtn svg{width:18px;height:18px}
  .live{width:100%;max-width:640px;margin-top:20px}
  .live .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--r-sm);border:0;font-size:14px;font-weight:600}
  .btn svg{width:18px;height:18px}
  .btn.primary{background:var(--primary);color:var(--on-primary)}.btn.primary:hover{background:var(--primary-dark)}
  .btn.ghost{background:var(--surface);color:var(--primary);border:1.5px solid var(--primary)}.btn.ghost:hover{background:var(--light)}
  .btn.soft{background:var(--light);color:var(--primary)}

  /* ---- Tabs ---- */
  .tabs{display:flex;gap:6px;background:var(--surface-alt);border-radius:12px;padding:4px;margin-top:16px;max-width:520px}
  .tab{flex:1;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:9px 4px;border-radius:9px}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
  .tab-note{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.5}

  /* ---- Spectrogram ---- */
  .spectro{display:grid;gap:2px}.spectro .r{display:grid;gap:2px;grid-auto-flow:column}.spectro .cell{height:12px;border-radius:2px}

  /* ---- Chart ---- */
  .chart svg{width:100%;display:block}.chart .cap{font-size:11px;color:var(--faint);margin-top:8px}
  .chart2{position:relative}
  .chart2 .c-unit{position:absolute;top:2px;left:4px;font-size:10.5px;color:var(--faint);font-family:var(--mono)}
  .chart2 .c-plot{position:relative}.chart2 .c-plot svg{width:100%;display:block}
  .chart2 .c-guide{position:absolute;top:0;bottom:20px;width:1px;background:var(--muted);opacity:.5;display:none;pointer-events:none}
  .chart2 .c-tip{position:absolute;top:4px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:8px 11px;font-size:11.5px;min-width:120px;display:none;pointer-events:none;z-index:5}
  .chart2 .c-tip .tt{font-weight:700;margin-bottom:5px}.chart2 .c-tip .tr{display:flex;justify-content:space-between;gap:14px;color:var(--muted);line-height:1.7}.chart2 .c-tip .tr b{color:var(--ink);font-family:var(--mono)}
  .chart2 .c-axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:4px;font-family:var(--mono)}

  /* ---- Table (history) ---- */
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--border)}
  .tbl td{padding:13px 14px;border-bottom:1px solid var(--divider)}
  .tbl tr:last-child td{border-bottom:0}
  .tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:var(--surface-alt)}
  .tbl .mono{font-family:var(--mono)}
  .tbl-wrap{overflow-x:auto}
  .thumb{width:34px;height:34px;display:inline-grid;place-items:center;vertical-align:middle}

  /* ---- Checklist ---- */
  .checklist{display:flex;flex-direction:column;gap:2px}
  .checklist .ci{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--divider);font-size:14px}
  .checklist .ci:last-child{border-bottom:0}
  .checklist .ck{width:22px;height:22px;border-radius:999px;display:grid;place-items:center;flex:none}.checklist .ck svg{width:14px;height:14px}
  .checklist .cl{flex:1}.checklist .cv{font-size:12.5px;font-weight:600}

  /* ---- Alert ---- */
  .alert{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 16px;background:var(--surface)}
  .alert .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}.alert .ico svg{width:18px;height:18px}
  .alert .t{font-size:14px;font-weight:700}.alert .c{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.55}.alert .a{font-size:12.5px;margin-top:6px;font-weight:600}

  .row{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--divider);font-size:14px}.row:last-child{border-bottom:0}.row .k{color:var(--muted)}.row .v{font-weight:600}.row .v.data{font-family:var(--mono)}
  .switch{position:relative;width:46px;height:27px;flex:none;display:inline-block}.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .switch .tk{position:absolute;inset:0;border-radius:999px;background:var(--border);transition:.2s}.switch .th{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:999px;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .switch input:checked~.tk{background:var(--secondary)}.switch input:checked~.th{transform:translateX(19px)}
  input.txt{border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-family:inherit;color:var(--ink);background:var(--surface);font-size:13.5px}
  .disclaimer{font-size:11.5px;color:var(--faint);line-height:1.6;margin-top:16px}
  .empty{text-align:center;padding:56px 20px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
  .empty .ei{width:60px;height:60px;border-radius:999px;background:var(--surface-alt);color:var(--primary);display:grid;place-items:center}.empty .ei svg{width:28px;height:28px}
  button:focus-visible,a:focus-visible,input:focus-visible,[role=tab]:focus-visible{outline:2px solid var(--secondary);outline-offset:2px;border-radius:8px}

  /* ---- Responsive ---- */
  @media(max-width:1080px){.c4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:900px){.c3{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:760px){
    .sidebar{width:60px;padding:16px 8px}.brand .bt,.brand .bs,.navlink span,.side-foot span,.collapse-btn span{display:none}
    .navlink{justify-content:center}.main{padding:20px 16px 60px}.header{padding:12px 16px}
    .c2,.c3,.c4{grid-template-columns:1fr}
  }
  .sidebar.mini{width:60px}.sidebar.mini .brand .bt,.sidebar.mini .brand .bs,.sidebar.mini .navlink span,.sidebar.mini .side-foot span,.sidebar.mini .collapse-btn span{display:none}
  .sidebar.mini .navlink{justify-content:center}
</style>

<script>
/* ================================================================
   MOSS AIR — 이끼 초음파 진단 (Desktop Web) · Demo(가상 센서)
   실제 하드웨어/AI/카메라 없음. 모든 수치는 UI 개발용 Demo 값.
   정상 범위는 "연구용 초기 기준(DEMO/RESEARCH BASELINE)".
   ================================================================ */

/* ---- 정상 범위(연구용 초기 기준 — 검증된 값 아님) ---- */
const BASELINE = { normalRangeMin: 30, normalRangeMax: 35, label: '연구용 초기 기준' };
const RANGE_LOW = 26, RANGE_HIGH = 40;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const r1=v=>Math.round(v*10)/10;
const two=n=>String(n).padStart(2,'0');
const DASH='--';

/* ---- 4단계 상태 ---- */
const STATUS = {
  normal:       { key:'NORMAL',            label:'정상',      cls:'st-normal',       color:'var(--good)',    tint:'var(--good-tint)',    icon:'i-check' },
  caution:      { key:'CAUTION',           label:'주의',      cls:'st-caution',      color:'var(--caution)', tint:'var(--caution-tint)', icon:'i-alert' },
  anomaly:      { key:'ANOMALY',           label:'이상 신호', cls:'st-anomaly',      color:'var(--anomaly)', tint:'var(--anomaly-tint)', icon:'i-alert' },
  insufficient: { key:'INSUFFICIENT_DATA', label:'판정 불가', cls:'st-insufficient', color:'var(--neutral)', tint:'var(--neutral-tint)', icon:'i-help'  },
};
/* 판정: 데이터/품질이 부족하면 절대 자동 정상 처리하지 않음 */
function classify(peak, quality){
  if(peak==null) return 'insufficient';
  if(quality==='low') return 'insufficient';   // 품질 낮음 → 확정 판정 불가
  const {normalRangeMin:lo, normalRangeMax:hi}=BASELINE;
  if(peak>=lo && peak<=hi) return 'normal';
  if(peak>=lo-3 && peak<=hi+3) return 'caution';
  return 'anomaly';
}
function matchPercent(peak){ if(peak==null) return null;
  const c=(BASELINE.normalRangeMin+BASELINE.normalRangeMax)/2, half=(BASELINE.normalRangeMax-BASELINE.normalRangeMin)/2;
  return Math.max(20,Math.min(97,Math.round(100-Math.max(0,Math.abs(peak-c)-half)*12))); }

/* ---- 이끼 종류(확장 구조 · 실제 데이터 없으므로 기본 1종만) ---- */
const MOSS_SPECIES = { id:'default', name:'기본 이끼 (종 미지정)', referenceImage:'moss-default',
  description:'현재 측정 대상 이끼. 연구 진행 시 종별 정상 범위·시각 자료로 확장.',
  normalRange:[BASELINE.normalRangeMin,BASELINE.normalRangeMax] };
let currentSpecies = MOSS_SPECIES;

/* ================= 이끼 Botanical Visual (공식 Asset · 전 화면 동일) ================= */
function _frond(x,baseY,h,lean,cStem,cLeaf){
  const topX=x+lean,topY=baseY-h,cx=x+lean*0.4,cy=baseY-h*0.55;
  const bez=t=>[(1-t)*(1-t)*x+2*(1-t)*t*cx+t*t*topX,(1-t)*(1-t)*baseY+2*(1-t)*t*cy+t*t*topY];
  const stem=`M${x} ${baseY} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${topX.toFixed(1)} ${topY.toFixed(1)}`;
  let lf='';const n=Math.max(4,Math.round(h/8));
  for(let i=1;i<=n;i++){const t=i/(n+0.7),[bx,by]=bez(t),L=2.5+7*(1-t);
    lf+=`<path d="M${bx.toFixed(1)} ${by.toFixed(1)} q${(-L*0.55).toFixed(1)} ${(-L*0.15).toFixed(1)} ${(-L*0.75).toFixed(1)} ${(-L*0.78).toFixed(1)}" fill="none" stroke="${cLeaf}" stroke-width="1.5" stroke-linecap="round"/>`;
    lf+=`<path d="M${bx.toFixed(1)} ${by.toFixed(1)} q${(L*0.55).toFixed(1)} ${(-L*0.15).toFixed(1)} ${(L*0.75).toFixed(1)} ${(-L*0.78).toFixed(1)}" fill="none" stroke="${cLeaf}" stroke-width="1.5" stroke-linecap="round"/>`;}
  lf+=`<circle cx="${topX.toFixed(1)}" cy="${topY.toFixed(1)}" r="2.4" fill="${cLeaf}"/>`;
  return `<path d="${stem}" fill="none" stroke="${cStem}" stroke-width="2" stroke-linecap="round"/>${lf}`;
}
let _mossCache=null;
function mossArtwork(){ if(_mossCache) return _mossCache;
  const C={1:'var(--moss-1)',2:'var(--moss-2)',3:'var(--moss-3)',4:'var(--moss-4)'};let s='';
  s+=`<ellipse cx="122" cy="176" rx="92" ry="24" fill="var(--moss-base-a)"/>`;
  s+=`<ellipse cx="122" cy="171" rx="72" ry="15" fill="var(--moss-base-b)"/>`;
  let ss=42;const rnd=()=>{ss=(ss*9301+49297)%233280;return ss/233280;};
  for(let i=0;i<16;i++){const dx=44+rnd()*156,dy=166+rnd()*15,r=1+rnd()*1.5;s+=`<circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="${r.toFixed(1)}" fill="var(--moss-2)" opacity="0.33"/>`;}
  [[106,172,120,-6],[140,172,126,7]].forEach(([x,by,h,lean])=>{const tx=x+lean,ty=by-h;
    s+=`<path d="M${x} ${by} Q${(x+lean*0.5).toFixed(1)} ${(by-h*0.5).toFixed(1)} ${tx} ${ty}" fill="none" stroke="var(--moss-seta)" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>`;
    s+=`<ellipse cx="${tx}" cy="${(ty-2).toFixed(1)}" rx="3" ry="4.3" fill="var(--moss-cap)" transform="rotate(${(lean*1.4).toFixed(1)} ${tx} ${(ty-2).toFixed(1)})"/>`;});
  [[58,168,44,-20,4,4],[186,168,46,20,4,4],[74,170,66,-14,2,4],[170,170,68,14,2,4],[100,172,72,-12,3,4],[144,172,74,12,3,4],[92,172,90,-8,2,3],[152,172,92,8,2,3],[108,173,104,-4,1,3],[136,173,106,4,1,2],[122,174,120,0,1,2]]
    .forEach(([x,by,h,lean,cs,cl])=>{s+=_frond(x,by,h,lean,C[cs],C[cl]);});
  _mossCache=s;return s;
}
function mossVisual(status,opts){const o=opts||{},size=o.size||150;
  const cls=status==='caution'?'is-caution':status==='anomaly'?'is-anomaly':status==='insufficient'?'is-insufficient':'is-normal';
  const col=STATUS[status].color;let ring='';
  if(o.ring){const r=92,c=2*Math.PI*r,pct=Math.max(0,Math.min(100,o.pct||0)),off=c*(1-pct/100);
    ring=`<circle cx="100" cy="100" r="${r}" fill="none" stroke="var(--divider)" stroke-width="6"/><circle class="mo-arc" cx="100" cy="100" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 100 100)"/>`;}
  return `<div class="moss-visual ${cls}" style="width:${size}px;height:${size}px"><svg viewBox="0 0 200 200" role="img" aria-label="이끼 상태 시각화: ${STATUS[status].label}">${ring}<svg x="24" y="42" width="152" height="126" viewBox="0 0 244 210" preserveAspectRatio="xMidYMax meet">${mossArtwork()}</svg></svg><span class="moss-dot" style="background:${col}"></span></div>`;
}

/* ================= 상태(단일 소스) ================= */
const sim = { sensorFault:false, lowQuality:false, noData:false };
const settings = loadSettings();      // demoMode, productName, productId, notify...
let sensorConnected = false;
let connection = 'demo';              // demo | connected | disconnected | error
let currentView = 'dashboard';
let analysisTab = 'wave';
let history = [];
let lastMeasurement = null;

/* ---- 환경/기기 데모 reading (실시간 갱신) ---- */
function initReading(){ return sanitizeEnv({temperature:24.2,humidity:61,moisture:76,light:5200,pm25In:40,pm25Out:26,
  airflow:2,fanMode:'auto',pressure:42,fan:'on',pump:'on',led:'off'}); }
let reading = initReading();
function stepReading(p){ return sanitizeEnv({
  temperature:clamp(r1((p.temperature??24)+(Math.random()*2-1)*.15),16,32),
  humidity:clamp(Math.round((p.humidity??60)+(Math.random()*2-1)),30,85),
  moisture:clamp(Math.round((p.moisture??76)-Math.random()*.4),0,100),
  light:clamp(Math.round((p.light??5000)+(Math.random()*2-1)*300),0,12000),
  pm25In:clamp(Math.round((p.pm25In??40)+(Math.random()*2-1)*1.5),18,55),
  pm25Out:(()=>{const i=clamp(Math.round((p.pm25In??40)),18,55);return clamp(Math.round(i*0.65+(Math.random()*2-1)),3,i-2);})(),
  airflow:p.airflow??2,fanMode:p.fanMode??'auto',pressure:clamp(Math.round((p.pressure??42)+(Math.random()*2-1)*2),10,200),
  fan:'on',pump:(p.moisture??76)<=0?'off':'on',led:(p.light??5000)<300?'on':'off'}); }
function sanitizeEnv(r){ const b=(v,a,c)=>v==null||Number.isNaN(v)||v<a||v>c?null:v;
  if(sim.sensorFault){ r={...r,pm25In:null,pm25Out:null}; }
  return {...r,temperature:b(r.temperature,-20,60),humidity:b(r.humidity,0,100),moisture:b(r.moisture,0,100),
    light:b(r.light,0,200000),pm25In:b(r.pm25In,0,1000),pm25Out:b(r.pm25Out,0,1000),pressure:b(r.pressure,0,1000)}; }

/* ---- 센서 자체 정상 여부 ---- */
function sensorHealth(){ const r=reading,f=sim.sensorFault;
  return [
    {label:'초음파 센서', ok:!f&&(sensorConnected||connection==='demo')},
    {label:'온습도 센서', ok:r.temperature!=null&&r.humidity!=null},
    {label:'수분 센서', ok:r.moisture!=null},
    {label:'조도 센서', ok:r.light!=null},
    {label:'PM2.5 센서(보조)', ok:r.pm25In!=null&&r.pm25Out!=null},
  ];
}

/* ================= 측정 세션 ================= */
function buildMeasurement(peak,duration,quality){
  const q=quality||(Math.random()>0.2?'high':'low');
  const st=classify(peak,q);
  const now=new Date();
  return { measurementId:'m_'+now.getTime(), timestamp:now, mossType:currentSpecies.name, sensorId:'US-01',
    temperature:reading.temperature, humidity:reading.humidity, moisture:reading.moisture,
    measurementDuration:duration, frequencyPeak:peak, signalStrength: peak==null?null:60+Math.round(Math.random()*30),
    waveform:makeWave(64,(peak||30)*10|0), measurementQuality:q,
    normalRangeMin:BASELINE.normalRangeMin, normalRangeMax:BASELINE.normalRangeMax,
    status:st, match: st==='insufficient'?null:matchPercent(peak) };
}
function makeWave(n,seed){let s=seed||7;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};const p=[];
  for(let i=0;i<n;i++)p.push(Math.sin(i/3.1)*.55+Math.sin(i/7.7)*.28+(rnd()-.5)*.5);return p;}

/* ---- 기록 시드 ---- */
function seed(y,mo,d,hh,mm,peak,q){const m=buildMeasurement(peak,30,q||'high');m.timestamp=new Date(y,mo-1,d,hh,mm);m.measurementId='seed_'+m.timestamp.getTime();return m;}
function seedHistory(){ history.push(
  seed(2026,9,11,14,32,32.5,'high'), seed(2026,9,10,10,15,37.4,'high'),
  seed(2026,9,8,9,40,31.8,'high'), seed(2026,9,6,18,5,33.4,'high'),
  seed(2026,9,4,11,20,29.2,'low')); }
function latest(){ return history.length?[...history].sort((a,b)=>b.timestamp-a.timestamp)[0]:null; }

/* ---- 통계용 시계열(고정 시드) ---- */
const SERIES=(()=>{let s=20260912;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};const now=Date.now();const o=[];
  for(let t=now-30*864e5;t<=now;t+=6*3600e3){const c=(BASELINE.normalRangeMin+BASELINE.normalRangeMax)/2;
    const peak=r1(c+Math.sin(t/(864e5/1.7))*1.6-0.02*((now-t)/864e5)+(rnd()-.5)*1.4);
    o.push({t,peak,match:matchPercent(peak),status:classify(peak,'high')});}return o;})();
function cutoff(p){const n=Date.now();return p==='7d'?n-7*864e5:p==='30d'?n-30*864e5:n-864e5;}

/* ================= 알림(문제→원인→권장) ================= */
function alerts(){ if(!settings.notifications) return []; const out=[]; const r=reading; const l=latest();
  if(connection==='disconnected'){ out.push({level:'anomaly',title:'센서 연결이 끊어졌습니다.',cause:'측정 장치와의 통신이 중단되었습니다.',action:'연결 상태를 확인한 뒤 다시 시도해주세요.'}); return out; }
  if(sim.sensorFault){ out.push({level:'caution',title:'센서 신호에 이상이 있습니다.',cause:'일부 센서 값이 정상 수신되지 않았습니다.',action:'센서 연결·위치를 확인하고 다시 측정해주세요.'}); }
  if(r.moisture!=null&&r.moisture<=15){ out.push({level:'anomaly',title:'수분(물탱크)이 부족합니다.',cause:`현재 수위 ${r.moisture}% 입니다.`,action:'물을 보충해주세요. 수분 부족은 측정에 영향을 줄 수 있습니다.'}); }
  else if(r.humidity!=null&&r.humidity>=80){ out.push({level:'caution',title:'과습 주의',cause:`현재 습도 ${r.humidity}% 로 높습니다.`,action:'수분 공급 상태와 환기를 확인해주세요.'}); }
  if(l){ if(l.status==='anomaly') out.push({level:'anomaly',title:'정상 범위를 벗어난 신호가 감지되었습니다.',cause:`최근 측정 주요 주파수 ${num(l.frequencyPeak,1)} kHz (정상 ${BASELINE.normalRangeMin}~${BASELINE.normalRangeMax}).`,action:'수분·환경을 확인하고 다시 측정해주세요. 반복되면 상태를 점검하세요.'});
    else if(l.status==='caution') out.push({level:'caution',title:'평소와 다른 초음파 패턴이 감지되었습니다.',cause:'정상 범위 경계 부근의 신호입니다.',action:'환경을 확인한 뒤 다시 측정해주세요.'});
    else if(l.status==='insufficient') out.push({level:'insufficient',title:'최근 측정 품질이 낮습니다.',cause:'신호가 불안정하여 상태를 확정할 수 없습니다.',action:'센서 위치를 조정한 뒤 다시 측정해주세요.'}); }
  return out;
}

/* ================= helpers ================= */
const num=(v,d=0)=>v==null||Number.isNaN(v)?DASH:v.toFixed(d);
function badge(status,label){const m=STATUS[status];return `<span class="badge ${m.cls}"><span class="dot"></span>${label??m.label}</span>`;}
function metric(icon,label,{value,unit,word,status}={}){const disp=word!=null?`<span class="word">${word}</span>`:(value==null||value===''?DASH:value)+(unit?`<span class="u">${unit}</span>`:'');
  return `<div class="metric"><div class="lbl"><svg><use href="#${icon}"/></svg>${label}</div><div class="val">${disp}</div>${status?`<div class="foot">${badge(status)}</div>`:''}</div>`;}
function alertCard(a){const m=STATUS[a.level];return `<div class="alert" style="border-color:color-mix(in srgb, ${m.color} 30%, var(--border))"><div class="ico" style="background:${m.tint};color:${m.color}"><svg><use href="#${a.level==='normal'?'i-check':a.level==='insufficient'?'i-help':'i-alert'}"/></svg></div><div style="flex:1"><div class="t" style="color:${m.color}">${a.title}</div><div class="c">원인: ${a.cause}</div><div class="a" style="color:${m.color}">권장: ${a.action}</div></div></div>`;}
function fmtDur(s){return `${two(Math.floor(s/60))}:${two(s%60)}`;}
function dateLabel(dt){return `${dt.getFullYear()}.${two(dt.getMonth()+1)}.${two(dt.getDate())}`;}
function tLabel(t,p){const d=new Date(t);return p==='today'?two(d.getHours())+':'+two(d.getMinutes()):(d.getMonth()+1)+'/'+d.getDate();}

/* Range bar */
function rangeBar(peak,status){ if(peak==null) return `<div style="color:var(--muted);font-size:13px;padding:10px 0">측정값이 없어 표시할 수 없습니다.</div>`;
  const span=RANGE_HIGH-RANGE_LOW,nL=((BASELINE.normalRangeMin-RANGE_LOW)/span)*100,nW=((BASELINE.normalRangeMax-BASELINE.normalRangeMin)/span)*100;
  const pos=Math.max(2,Math.min(98,((peak-RANGE_LOW)/span)*100)),col=STATUS[status].color;
  return `<div class="rb"><div class="rb-track"><div class="rb-normal" style="left:${nL}%;width:${nW}%"></div></div><div class="rb-mark" style="left:${pos}%"></div><div class="rb-dot" style="left:${pos}%;background:${col}"></div><div class="rb-cap" style="left:${pos}%">${peak.toFixed(1)} kHz</div></div>
    <div class="rb-ends"><span>낮음 · ${RANGE_LOW}</span><span>정상 ${BASELINE.normalRangeMin}~${BASELINE.normalRangeMax}</span><span>${RANGE_HIGH} · 높음</span></div>`;
}
/* Line chart(파형) */
function lineChart(vals,{color='var(--primary)',h=110,fill=true}={}){ if(!vals.length)return '';const w=640,pad=8;
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;const x=i=>pad+i*(w-pad*2)/(vals.length-1),y=v=>pad+(h-pad*2)*(1-(v-mn)/rg);
  const path=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const area=`${path} L ${x(vals.length-1).toFixed(1)} ${h-pad} L ${pad} ${h-pad} Z`;
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".16"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${fill?`<path d="${area}" fill="url(#wg)"/>`:''}<path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
}
/* 추세 chart(정상 범위 밴드 + hover) */
let _cid=0;
function trendChart(series,{period='7d'}={}){ if(!series.length) return '<div style="color:var(--muted);padding:20px">데이터 없음</div>';
  const id='tg'+(++_cid),vals=series.map(s=>s.peak),W=640,H=150,padX=8,padTop=14;
  const lo=RANGE_LOW,hi=RANGE_HIGH,rg=hi-lo;const x=i=>padX+i*(W-padX*2)/Math.max(1,vals.length-1),y=v=>padTop+(H-padTop-6)*(1-(clamp(v,lo,hi)-lo)/rg);
  const path=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const bt=y(BASELINE.normalRangeMax),bb=y(BASELINE.normalRangeMin);
  const pts=series.map(s=>({tl:tLabel(s.t,period),peak:r1(s.peak),st:STATUS[s.status].label}));
  const ax=[pts[0].tl,pts[Math.floor(pts.length/2)].tl,pts[pts.length-1].tl];
  return `<div class="chart2" data-pts='${JSON.stringify(pts)}'><div class="c-unit">kHz</div><div class="c-plot" style="height:${H}px">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px" role="img" aria-label="초음파 추세(정상 범위 표시)">
    <rect x="0" y="${bt.toFixed(1)}" width="${W}" height="${Math.max(0,bb-bt).toFixed(1)}" fill="var(--secondary)" opacity=".16"/>
    <line x1="0" y1="${bt.toFixed(1)}" x2="${W}" y2="${bt.toFixed(1)}" stroke="var(--secondary)" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>
    <line x1="0" y1="${bb.toFixed(1)}" x2="${W}" y2="${bb.toFixed(1)}" stroke="var(--secondary)" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>
    <path d="${path}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="c-guide"></div><div class="c-tip"></div></div>
    <div class="c-axis"><span>${ax[0]}</span><span>${ax[1]}</span><span>${ax[2]}</span></div></div>`;
}
/* Spectrogram(mock) */
function spectrogram(seed){let s=seed||3;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};let h='<div class="spectro">';
  for(let r=0;r<6;r++){h+='<div class="r">';for(let c=0;c<24;c++){const band=Math.exp(-Math.pow(r-2.2,2)/2.2),v=Math.min(1,band*(.55+rnd()*.7));h+=`<div class="cell" style="background:color-mix(in srgb, var(--primary) ${Math.round(v*100)}%, var(--surface-alt))"></div>`;}h+='</div>';}
  return h+'</div>';}

/* ================= Moss Status Component (대표 UI) ================= */
function mossStatusComponent(m,{size=200}={}){

    caution:'평소와 다른 초음파 패턴이 감지되었습니다. 이상으로 확정할 수는 없어 추가 측정이 필요합니다.',
    anomaly:'정상 범위를 벗어난 신호가 감지되었습니다. 환경을 확인하고 다시 측정해주세요.',
    insufficient:'판정에 필요한 데이터가 부족합니다. 센서를 연결하고 측정을 진행해주세요.' }[st];
  return `<div class="card moss-status">
    <div>${mossVisual(st,{size,ring:true,pct:match||0})}</div>
    <div>
      <div class="ms-eyebrow">이끼 초음파 상태</div>

        <div><div class="k">정상 범위 <span style="color:var(--faint)">(${BASELINE.label})</span></div><div class="v">${BASELINE.normalRangeMin}~${BASELINE.normalRangeMax} kHz</div></div>

      </div>

}

function calcEff(inV,outV){ if(inV==null||outV==null||inV<=0) return 0; const e=((inV-outV)/inV)*100; return Number.isFinite(e)?Math.round(Math.min(100,Math.max(0,e))*10)/10:0; }

function seriesCsv(){ const rows=[['time','peak_kHz','status','normal_min','normal_max']];

  history.forEach(m=>rows.push([m.timestamp.toISOString(),num(m.frequencyPeak,1),STATUS[m.status].key,m.normalRangeMin,m.normalRangeMax]));
  return rows.map(r=>r.join(',')).join('\n'); }
function downloadCsv(name,text){ try{const blob=new Blob([text],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);return true;}catch(e){return false;} }

    if(k in sim){ sim[k]=b.checked; reading=sanitizeEnv(reading); } else { settings[k]=b.checked; persist(); }
    render();});
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));
  bindCharts();
}
function bindCharts(){ document.querySelectorAll('.chart2').forEach(c=>{const plot=c.querySelector('.c-plot'),tip=c.querySelector('.c-tip'),guide=c.querySelector('.c-guide');let pts=[];try{pts=JSON.parse(c.dataset.pts);}catch(e){}if(!pts.length||!plot)return;
  const mv=e=>{const rc=plot.getBoundingClientRect();let rel=(e.clientX-rc.left)/rc.width;rel=Math.max(0,Math.min(1,rel));const i=Math.round(rel*(pts.length-1)),p=pts[i],xp=(pts.length>1?i/(pts.length-1):0)*100;
    guide.style.left=xp+'%';guide.style.display='block';tip.style.display='block';tip.style.left=Math.max(12,Math.min(88,xp))+'%';
    tip.innerHTML=`<div class="tt">${p.tl}</div><div class="tr"><span>주파수</span><b>${p.peak} kHz</b></div><div class="tr"><span>상태</span><b>${p.st}</b></div>`;};
  plot.addEventListener('mousemove',mv);plot.addEventListener('mouseleave',()=>{tip.style.display='none';guide.style.display='none';});});}

/* nav */
const NAVKEYS=Object.keys(BAR);
function go(name){ if(!NAVKEYS.includes(name)) name='dashboard'; currentView=name;
  document.querySelectorAll('.navlink').forEach(n=>n.classList.toggle('active',n.dataset.nav===name));
  if(name!=='measure') resetMeasure();
  try{ if(location.hash!=='#'+name) history_pushState(name); }catch(e){}
  document.querySelector('.main').scrollTop=0; render();
}
function history_pushState(name){ try{window.history.pushState({v:name},'','#'+name);}catch(e){} }
window.addEventListener('popstate',()=>{ const h=(location.hash||'#dashboard').slice(1); currentView=NAVKEYS.includes(h)?h:'dashboard';
  document.querySelectorAll('.navlink').forEach(n=>n.classList.toggle('active',n.dataset.nav===currentView)); render(); });

/* header/theme/collapse */
function updateHeader(){ const c=document.getElementById('h-conn'),t=document.getElementById('h-conn-t');
  c.className='chip'+(connection==='disconnected'?' err':''); t.textContent=connLabel();
  document.getElementById('h-mode').textContent=settings.demoMode?'DEMO MODE':'REAL DATA';
  document.getElementById('h-mode').style.display=settings.demoMode?'':'none'; }
document.getElementById('theme-btn').onclick=()=>{const root=document.documentElement,pd=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches,cur=root.getAttribute('data-theme')||(pd?'dark':'light'),nx=cur==='dark'?'light':'dark';root.setAttribute('data-theme',nx);document.getElementById('theme-i').setAttribute('href',nx==='dark'?'#i-sun':'#i-moon');try{localStorage.setItem('moss_dx_theme',nx);}catch(e){}};
document.getElementById('collapse').onclick=()=>document.getElementById('sidebar').classList.toggle('mini');

/* storage */
function loadSettings(){const d={productName:'거실 MOSS AIR',productId:'MOSS-001',demoMode:true,notifications:true};try{const r=localStorage.getItem('moss_dx');return r?{...d,...JSON.parse(r)}:d;}catch(e){return d;}}
function persist(){try{localStorage.setItem('moss_dx',JSON.stringify(settings));}catch(e){}}
try{const t=localStorage.getItem('moss_dx_theme');if(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('theme-i').setAttribute('href',t==='dark'?'#i-sun':'#i-moon');}}catch(e){}

/* 실시간 환경 갱신(대시보드/환경/기기에서만) */
setInterval(()=>{ if(connection==='disconnected')return; reading=stepReading(reading);
  if(['dashboard','environment','device'].includes(currentView)) render(); },3000);

/* init */
seedHistory(); lastMeasurement=latest();
const h0=(location.hash||'').slice(1); if(NAVKEYS.includes(h0)) currentView=h0;
updateHeader(); go(currentView);
</script>
