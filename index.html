<style>
  :root{
    --bg:#F4F7F4; --surface:#fff; --surface-alt:#EEF2EE; --border:#E1E7E1; --divider:#EDF1ED;
    --primary:#1F5A3D; --primary-dark:#163F2B; --accent:#4CAF7D; --mint:#E4F2EA;
    --ink:#1C2A22; --muted:#62706A; --faint:#93A099;
    --good:#2E8B5B; --good-tint:#E5F3EB; --warning:#C9822B; --warning-tint:#FBF0DE; --danger:#C34B3F; --danger-tint:#F8E5E2;
    --radius:16px; --radius-sm:10px; --shadow:0 1px 2px rgba(20,40,30,.04),0 8px 22px rgba(20,40,30,.05);
    --font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.5}
  h1,h2,h3,p{margin:0} button{font-family:inherit;cursor:pointer}
  .shell{display:flex;min-height:100vh}
  .sidebar{width:240px;flex:none;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 16px;gap:6px}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
  .brand .mark{width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center}
  .brand .mark svg{width:20px;height:20px}
  .brand .bt{font-size:16px;font-weight:700}.brand .bs{font-size:11px;color:var(--muted)}
  .navlink{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--muted);font-size:14px;font-weight:600;border:0;background:none;width:100%;text-align:left}
  .navlink svg{width:20px;height:20px}
  .navlink:hover{background:var(--surface-alt);color:var(--ink)}
  .navlink.active{background:var(--mint);color:var(--primary)}
  .sidebar .spacer{flex:1}
  .demo-tag{font-size:11px;color:var(--muted);padding:8px 10px;border:1px dashed var(--border);border-radius:10px;text-align:center}
  .content{flex:1;min-width:0;padding:28px 34px 60px}
  .inner{max-width:1040px;margin:0 auto}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap}
  .topbar h1{font-size:24px;font-weight:700;letter-spacing:-.3px}.topbar .sub{font-size:13px;color:var(--muted);margin-top:3px}
  .conn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border)}
  .conn .dot{width:8px;height:8px;border-radius:999px;background:var(--good)} .conn.err .dot{background:var(--danger)} .conn .ago{color:var(--muted);font-weight:400}
  .grid{display:grid;gap:16px}.cols-2{grid-template-columns:repeat(2,1fr)}.cols-3{grid-template-columns:repeat(3,1fr)}.cols-4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:900px){.cols-3,.cols-4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:620px){.sidebar{width:64px}.brand .bt,.brand .bs,.navlink span,.demo-tag{display:none}.cols-2,.cols-3,.cols-4{grid-template-columns:1fr}.content{padding:20px 16px 60px}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)} .card.pad{padding:20px}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:28px 2px 12px}.section-head h2{font-size:16px;font-weight:700}.section-head .hint{font-size:12.5px;color:var(--muted)}
  .metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
  .metric .lbl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:600}.metric .lbl svg{width:16px;height:16px}
  .metric .val{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:8px;letter-spacing:-.5px}.metric .val .u{font-family:var(--font);font-size:13px;color:var(--muted);margin-left:4px}.metric .val .word{font-family:var(--font);font-size:18px}

  /* 판단 근거 체크리스트 */

  .checklist .ci{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--divider);font-size:14px}
  .checklist .ci:last-child{border-bottom:0}
  .checklist .ci .ck{width:22px;height:22px;border-radius:999px;display:grid;place-items:center;flex:none}

  /* 그래프(시간축·단위·hover) */

  .chart2 .c-plot{position:relative}
  .chart2 .c-plot svg{width:100%;display:block}
  .chart2 .c-guide{position:absolute;top:0;bottom:20px;width:1px;background:var(--muted);opacity:.5;display:none;transform:translateX(-.5px);pointer-events:none}
  .chart2 .c-tip{position:absolute;top:4px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:8px 11px;font-size:11.5px;min-width:120px;display:none;pointer-events:none;z-index:5}
  .chart2 .c-tip .tt{font-weight:700;margin-bottom:5px;font-size:12px}
  .chart2 .c-tip .tr{display:flex;justify-content:space-between;gap:14px;color:var(--muted);line-height:1.7}
  .chart2 .c-tip .tr b{color:var(--ink);font-family:var(--mono)}
  .chart2 .c-axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:4px;font-family:var(--mono)}
</style>

<script>
/* ============ MOSS AIR WEB — 데모(가상 센서) 실행 버전 ============
   Next.js 버전과 동일한 로직(정화효율/알림/필터/통계). 실제 하드웨어/카메라 없음. */
const THRESH={ waterLow:30, waterCrit:15, airflowMin:1, effDrop:8, lightLow:300, pmNormal:35, pmBad:75 };
const BASELINE=39;
const STATUS={
  good:{label:'정상',color:'var(--good)',tint:'var(--good-tint)'},
  warning:{label:'주의',color:'var(--warning)',tint:'var(--warning-tint)'},
  inspect:{label:'점검 필요',color:'var(--warning)',tint:'var(--warning-tint)'},
  replace:{label:'교체 권장',color:'var(--danger)',tint:'var(--danger-tint)'},
  neutral:{label:'대기',color:'var(--muted)',tint:'var(--surface-alt)'},
};
function calcEff(inV,outV){ if(inV==null||outV==null||inV<=0)return 0; const e=((inV-outV)/inV)*100; return Number.isFinite(e)?Math.round(Math.min(100,Math.max(0,e))*10)/10:0; }
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)); const drift=s=>(Math.random()*2-1)*s; const r1=v=>Math.round(v*10)/10;

/* ---- 상태 ---- */
let sim={ sensorFault:false };
let reading=initReading();
let connection='demo';
let lastUpdated=Date.now();
let current='dashboard';
const settings=loadSettings();

const DEMO_TARGET_EFF=35;                 // Demo 목표 정화효율(안정 유지)
function initReading(){ return sanitize({deviceId:'MOSS-001',pm25In:40,pm25Out:26,temperature:24.2,humidity:61,waterLevel:76,light:5200,airflow:2,fanMode:'auto',pressure:42,fan:'on',pump:'on',led:'off'}); }
function step(p){
  /* 유입은 천천히 변동, 배출은 목표 정화효율을 기준으로 계산 → 효율이 안정적으로 유지되고
     모든 페이지가 동일한 reading을 사용하므로 값이 페이지마다 달라지지 않음 */
  const inV=clamp(Math.round((p.pm25In??40)+drift(1.5)),18,55);
  const outV=clamp(Math.round(inV*(1-DEMO_TARGET_EFF/100)+drift(1)),3,inV-2);
  const light=clamp(Math.round((p.light??5000)+drift(300)),0,12000);
  const water=clamp(Math.round((p.waterLevel??76)-Math.random()*0.5),0,100);
  return sanitize({deviceId:'MOSS-001',pm25In:inV,pm25Out:outV,
    temperature:clamp(r1((p.temperature??24)+drift(.15)),16,32),
    humidity:clamp(Math.round((p.humidity??60)+drift(1)),30,85),
    waterLevel:water,light,airflow:p.airflow??2,fanMode:p.fanMode??'auto',
    pressure:clamp(Math.round((p.pressure??42)+drift(2)),10,200),
    fan:'on',pump:water<=0?'off':'on',led:light<THRESH.lightLow?'on':'off'});
}
function sanitize(r){
  const b=(v,a,c)=> v==null||Number.isNaN(v)||v<a||v>c?null:v;
  if(sim.sensorFault){ r={...r,pm25In:null,pm25Out:null}; }
  const inV=b(r.pm25In,0,1000), outV=b(r.pm25Out,0,1000);
  return {...r,pm25In:inV,pm25Out:outV,temperature:b(r.temperature,-20,60),humidity:b(r.humidity,0,100),
    waterLevel:b(r.waterLevel,0,100),light:b(r.light,0,200000),pressure:b(r.pressure,0,1000),
    efficiency:calcEff(inV,outV),ts:new Date().toISOString()};
}

/* ---- 통계 기록(고정 시드) ---- */
const SERIES=(()=>{ let s=20260912; const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;}; const now=Date.now(); const out=[];
  for(let t=now-30*864e5;t<=now;t+=3600e3){ const day=(now-t)/864e5;
    const pmIn=Math.max(16,Math.round(40+Math.sin(t/(864e5/2))*8+(rnd()-.5)*6));
    const effTarget=clamp(BASELINE-day*0.10+(rnd()-.5)*3,0,80);   // 초기 대비 완만한 하락
    const pmOut=Math.max(2,Math.round(pmIn*(1-effTarget/100)));
    const eff=calcEff(pmIn,pmOut);                                 // 화면과 동일한 공식으로 산출
    out.push({t,pmIn,pmOut,eff,water:8+rnd()*6}); } return out; })();
function cutoff(p){ const n=Date.now(); return p==='today'?n-864e5:p==='7d'?n-7*864e5:n-30*864e5; }
function eff7d(){ const a=SERIES.filter(p=>p.t>=cutoff('7d')).map(p=>p.eff); return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:BASELINE; }
function effTrend(){ /* 7일을 앞·뒤 절반으로 나눈 평균 차이(추세). 음수=하락 */
  const a=SERIES.filter(p=>p.t>=cutoff('7d')).map(p=>p.eff); if(a.length<4) return 0;
  const h=Math.floor(a.length/2); const head=a.slice(0,h),tail=a.slice(-h);
  const m=x=>x.reduce((s,y)=>s+y,0)/x.length; return Math.round((m(tail)-m(head))*10)/10; }
function usage(p){ const pts=SERIES.filter(x=>x.t>=cutoff(p)); const pmO=pts.map(x=>x.pmOut),ef=pts.map(x=>x.eff);
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:null;
  let ser=pts.map(x=>({t:x.t,pmIn:x.pmIn,pmOut:x.pmOut,eff:x.eff})); if(ser.length>60){const n=Math.ceil(ser.length/60);ser=ser.filter((_,i)=>i%n===0);}
  return {label:p==='today'?'오늘':p==='7d'?'최근 7일':'최근 30일',period:p,avgPm:avg(pmO),avgEff:avg(ef),
    maxPm:pmO.length?Math.max(...pmO):null,minPm:pmO.length?Math.min(...pmO):null,hours:pts.length,
    water:Math.round(pts.reduce((s,x)=>s+x.water,0)),ser}; }

/* ---- 필터 판단 (카메라 없이 센서 데이터만) ----
   우선순위: 물 부족 → 풍량 → 센서 → 환경 → (모두 정상일 때) 정화효율 추세 */
function evalFilter(r){
  const avg=eff7d(), drop=BASELINE-avg, trend=effTrend();
  const sensorOk=!(r.pm25In==null||r.pm25Out==null);
  const moisture=r.waterLevel==null?'neutral':r.waterLevel<=THRESH.waterCrit?'replace':r.waterLevel<=THRESH.waterLow?'warning':'good';
  const airflow=r.airflow==null?'neutral':r.airflow<THRESH.airflowMin?'warning':'good';
  const light=r.light==null?'neutral':r.light<THRESH.lightLow?'warning':'good';
  const sensor=sensorOk?'good':'warning';
  const perf=!sensorOk?'neutral':drop>=THRESH.effDrop?'replace':drop>=THRESH.effDrop/2?'warning':'good';
  /* 판단 근거 체크리스트 */
  const checks=[
    {label:'정화 성능', status:perf,   ok:'정상', bad:perf==='replace'?'저하':'다소 낮음'},
    {label:'공기 흐름', status:airflow, ok:'정상', bad:'약함'},
    {label:'수분 상태', status:moisture,ok:'정상', bad:moisture==='replace'?'부족':'낮음'},
    {label:'빛 상태',   status:light,   ok:'정상', bad:'부족'},
    {label:'센서',      status:sensor,  ok:'정상', bad:'이상'},
  ];
  const mk=(st,reason,rep=false)=>({current:r.efficiency,baseline:BASELINE,avg7d:avg,trend,airflow,moisture,light,sensor,perf,checks,status:st,reason,replace:rep});
  if(r.waterLevel!=null&&r.waterLevel<=THRESH.waterCrit) return mk('warning','물탱크의 물이 부족합니다. 먼저 물을 보충해주세요. (필터 교체 아님)');
  if(r.airflow!=null&&r.airflow<THRESH.airflowMin) return mk('inspect','공기 흐름이 약합니다. 흡입구·배출구 막힘을 확인해주세요.');
  if(!sensorOk) return mk('inspect','센서 값이 정상 수신되지 않아 성능을 판단할 수 없습니다. 센서를 점검해주세요.');
  if(drop>=THRESH.effDrop) return mk('replace',`최근 7일 정화 효율이 초기(${BASELINE}%)보다 지속 감소(최근 ${avg}%). 환경·풍량·수분·센서가 정상인데도 성능 저하가 이어져 이끼 필터 점검·교체를 권장합니다.`,true);
  if(drop>=THRESH.effDrop/2) return mk('warning','정화 효율이 초기보다 다소 낮아졌습니다. 추세를 지켜봐 주세요.');
  return mk('good','현재 조건에서 특이 이상 없이 정상 작동 중입니다.');
}
/* ---- 필터 예상 수명 ----
   실제 사용 이력이 충분하지 않으므로 임의의 교체일을 표시하지 않는다.
   충분한 데이터가 쌓이면 효율 추세(trend) 기반으로 계산할 수 있는 구조만 준비한다. */
const FILTER_LIFE_MIN_DAYS=14;   // 예상 수명 계산에 필요한 최소 관측 일수
function filterLife(){
  const observedDays=Math.round((Date.now()-SERIES[0].t)/864e5);
  const trend=effTrend();  // 7일 앞뒤 절반 평균 차이(음수=하락)
  if(observedDays<FILTER_LIFE_MIN_DAYS||trend>=0){
    return {enough:false, text:'데이터 수집 중', note:'충분한 데이터가 확보되면 효율 추세를 바탕으로 예상 교체 시점을 계산합니다.'};
  }
  /* 구조 예시: 현재 효율이 임계(교체권장 기준)까지 떨어지는 데 걸리는 일수 추정 */
  const perWeek=-trend; const perDay=perWeek/7;
  const margin=eff7d()-(BASELINE-THRESH.effDrop);
  const days=perDay>0?Math.round(margin/perDay):null;
  return {enough:true, text:days!=null&&days>0?`약 ${days}일 후 점검 권장`:'점검 권장', note:'효율 추세 기반 추정값(참고용)입니다.'};
}

/* ---- 알림 ---- */
function alerts(){
  if(!settings.notifications) return [];
  const r=reading, out=[]; const f=evalFilter(r);
  const on={water_low:settings.alertWater,filter_replace:settings.alertFilter,disconnected:settings.alertDisconnect};
  const push=a=>{ if(on[a.kind]!==false) out.push(a); };
  if(connection==='disconnected'){ if(on.disconnected!==false) out.push({kind:'disconnected',level:'replace',title:'제품 연결이 끊어졌습니다.',cause:'제품과의 통신이 중단되었습니다.',action:'전원과 네트워크 상태를 확인한 뒤 다시 연결해주세요.'}); return out; }
  if(r.pm25In==null||r.pm25Out==null) push({kind:'sensor_error',level:'warning',title:'센서 신호에 이상이 있습니다.',cause:'일부 센서 값이 정상 수신되지 않았습니다.',action:'센서 연결 상태를 확인하고 잠시 후 다시 시도해주세요.'});
  if(r.waterLevel!=null&&r.waterLevel<=THRESH.waterCrit) push({kind:'water_low',level:'replace',title:'물탱크의 물이 부족합니다.',cause:`물탱크 잔량이 ${r.waterLevel}% 입니다.`,action:'물을 보충해주세요. 수분이 부족하면 정화 성능이 낮아질 수 있습니다.'});
  else if(r.waterLevel!=null&&r.waterLevel<=THRESH.waterLow) push({kind:'water_low',level:'warning',title:'물탱크의 물이 곧 부족해집니다.',cause:`물탱크 잔량이 ${r.waterLevel}% 입니다.`,action:'가까운 시일 내에 물을 보충해주세요.'});
  if(r.airflow!=null&&r.airflow<THRESH.airflowMin) push({kind:'airflow_abnormal',level:'warning',title:'공기 흐름이 약합니다.',cause:'풍량이 정상보다 낮습니다.',action:'흡입구·배출구가 막히지 않았는지 확인해주세요.'});
  const waterOk=r.waterLevel==null||r.waterLevel>THRESH.waterLow;
  if(waterOk&&BASELINE-eff7d()>=THRESH.effDrop) push({kind:'efficiency_drop',level:'warning',title:'정화 효율이 낮아지고 있습니다.',cause:`최근 7일 평균(${eff7d()}%)이 초기(${BASELINE}%)보다 낮습니다.`,action:'환경과 필터 상태를 점검해주세요.'});
  if(f.replace) push({kind:'filter_replace',level:'replace',title:'이끼 필터 교체가 권장됩니다.',cause:'환경·풍량·센서가 정상인데도 정화 성능 저하가 지속되고 있습니다.',action:'이끼 필터의 성능 저하 가능성이 높습니다. 필터 점검·교체를 권장합니다.'});
  return out;
}

/* ---- helpers ---- */
const DASH='--';
const num=(v,d=0)=> v==null||Number.isNaN(v)?DASH:v.toFixed(d);
const airLabel=a=>a==null?DASH:['정지','약','보통','강'][a]??DASH;
const actLabel=s=>s==='on'?'작동 중':s==='off'?'꺼짐':'오류';
const actLevel=s=>s==='on'?'good':s==='error'?'replace':'neutral';
const connLabel=c=>({connected:'연결됨',connecting:'연결 중',disconnected:'연결 끊김',error:'오류',demo:'Demo Mode'}[c]||DASH);
function ago(){ const s=Math.floor((Date.now()-lastUpdated)/1000); return s<5?'방금':s<60?s+'초 전':Math.floor(s/60)+'분 전'; }
function badge(level,label){ const m=STATUS[level]; return `<span class="badge" style="background:${m.tint};color:${m.color}"><span class="dot" style="background:${m.color}"></span>${label??m.label}</span>`; }
function metric(icon,label,{value,unit,word,status}={}){ const disp=word!=null?`<span class="word">${word}</span>`:(value==null||value===''?DASH:value)+(unit?`<span class="u">${unit}</span>`:'');
  return `<div class="metric"><div class="lbl"><svg><use href="#i-${icon}"/></svg>${label}</div><div class="val">${disp}</div>${status?`<div class="foot">${badge(status)}</div>`:''}</div>`; }
function alertCard(a){ const m=STATUS[a.level]; return `<div class="alert" style="border-color:color-mix(in srgb, ${m.color} 30%, var(--border))"><div class="ico" style="background:${m.tint};color:${m.color}"><svg><use href="#i-${a.level==='good'?'check':'alert'}"/></svg></div><div style="flex:1"><div class="t" style="color:${m.color}">${a.title}</div><div class="c">${a.cause}</div><div class="a" style="color:${m.color}">권장: ${a.action}</div></div></div>`; }
function lineChart(vals,{color='var(--primary)',band}={}){ if(!vals.length)return '<div style="color:var(--muted);padding:20px">데이터 없음</div>'; const w=640,h=150,pad=10;
  const lo=band?band.lo:Math.min(...vals),hi=band?band.hi:Math.max(...vals),range=(hi-lo)||1;
  const x=i=>pad+i*(w-pad*2)/Math.max(1,vals.length-1),y=v=>pad+(h-pad*2)*(1-(v-lo)/range);
  const path=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const area=`${path} L ${x(vals.length-1).toFixed(1)} ${h-pad} L ${pad} ${h-pad} Z`;
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".16"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${band?`<rect x="0" y="${y(band.max)}" width="${w}" height="${Math.max(0,y(band.min)-y(band.max))}" fill="var(--good)" opacity=".14"/>`:''}<path d="${area}" fill="url(#lg)"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`; }
function header(title,sub){ const cls=connection==='disconnected'?'conn err':'conn';
  return `<div class="topbar"><div><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div><div class="${cls}"><span class="dot"></span>${connLabel(connection)}<span class="ago">· ${ago()}</span></div></div>`; }
function airStatus(v){ return v==null?'neutral':v<=THRESH.pmNormal?'good':v<=THRESH.pmBad?'warning':'replace'; }
function two(n){ return String(n).padStart(2,'0'); }
function airCmh(level){ return level==null?null:([0,90,140,185][level]); }         // Demo 환산값(가상)
function fanModeLabel(m){ return ({auto:'자동',low:'약',mid:'보통',high:'강',off:'꺼짐'}[m])||'자동'; }
function airflowStatus(level){ return level==null?'neutral':level<THRESH.airflowMin?'warning':'good'; }
function tLabel(t,period){ const d=new Date(t); return period==='today'?two(d.getHours())+':'+two(d.getMinutes()):(d.getMonth()+1)+'/'+d.getDate(); }
/* 시간축·단위·hover(전단/후단/효율)를 갖춘 추세 그래프 */
let _cid=0;
function trendChart(series,{metric='eff',color='var(--primary)',unit='',band=null,period='7d'}={}){
  if(!series||!series.length) return '<div style="color:var(--muted);padding:20px">데이터 없음</div>';
  const id='lg'+(++_cid); const vals=series.map(s=>s[metric]);
  const W=640,H=150,padX=8,padTop=16;
  const lo=band?band.lo:Math.min(...vals), hi=band?band.hi:Math.max(...vals), range=(hi-lo)||1;
  const x=i=>padX+i*(W-padX*2)/Math.max(1,vals.length-1);
  const y=v=>padTop+(H-padTop-6)*(1-(v-lo)/range);
  const path=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const area=`${path} L ${x(vals.length-1).toFixed(1)} ${H} L ${padX} ${H} Z`;
  const bandRect=(band&&band.min!=null)?`<rect x="0" y="${y(band.max).toFixed(1)}" width="${W}" height="${Math.max(0,y(band.min)-y(band.max)).toFixed(1)}" fill="var(--good)" opacity=".14"/>`:'';
  const pts=series.map(s=>({tl:tLabel(s.t,period),pmIn:s.pmIn,pmOut:s.pmOut,eff:s.eff}));
  const ax=[pts[0].tl,pts[Math.floor(pts.length/2)].tl,pts[pts.length-1].tl];
  return `<div class="chart2" data-pts='${JSON.stringify(pts)}'>
    <div class="c-unit">${unit}</div>
    <div class="c-plot" style="height:${H}px">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px" role="img" aria-label="추세 그래프 (${unit})">
        <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".16"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
        ${bandRect}<path d="${area}" fill="url(#${id})"/>
        <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="c-guide"></div><div class="c-tip"></div>
    </div>
    <div class="c-axis"><span>${ax[0]}</span><span>${ax[1]}</span><span>${ax[2]}</span></div>
  </div>`;
}

  const ck=c=>{ const ok=c.status==='good', neu=c.status==='neutral'; const col=ok?'var(--good)':neu?'var(--muted)':STATUS[c.status].color;
    const tint=ok?'var(--good-tint)':neu?'var(--surface-alt)':STATUS[c.status].tint; const icon=ok?'check':'alert';
    return `<div class="ci"><span class="ck" style="background:${tint};color:${col}"><svg><use href="#i-${icon}"/></svg></span><span class="cl">${c.label}</span><span class="cv" style="color:${col}">${ok?c.ok:neu?'—':c.bad}</span></div>`; };
  return header('필터','이끼 필터 상태 및 교체 판단')
    +`<div class="hero" style="background:${m.tint}"><div style="min-width:120px"><div class="eyebrow" style="color:${m.color}">이끼 필터 상태</div><div class="big" style="color:${m.color}">${m.label}</div></div><div>${badge(f.status)}<div class="msg" style="margin-top:10px">${f.reason}</div></div></div>`
    +`<div class="section-head"><h2>판단 근거</h2><span class="hint">카메라 없이 센서 데이터로 판단</span></div><div class="card pad"><div class="checklist">${f.checks.map(ck).join('')}</div></div>`
    +`<div class="section-head"><h2>정화 성능</h2></div><div class="grid cols-3">${metric('gauge','현재 정화 효율',{value:num(f.current),unit:'%'})}${metric('gauge','초기 정화 효율',{value:num(f.baseline),unit:'%'})}${metric('stats','최근 7일 평균',{value:num(f.avg7d),unit:'%'})}</div>`
    +`<div class="section-head"><h2>예상 수명</h2></div><div class="card pad"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><div style="font-size:20px;font-weight:700">${life.text}</div><div style="font-size:12.5px;color:var(--muted);margin-top:4px">${life.note}</div></div>${life.enough?badge('warning','참고용'):badge('neutral','수집 중')}</div></div>`
    +(f.replace?`<div class="section-head"><h2>교체 권장</h2></div>${alertCard({level:'replace',title:'필터 교체 권장',cause:f.reason,action:'이끼 필터의 성능 저하 가능성이 높습니다. 필터 점검·교체를 진행해 주세요.'})}`:'')
    +`<p class="disclaimer">판단 순서: 물 부족 → 풍량 → 센서 이상 → 환경 → (모두 정상일 때) 정화 효율 추세. 한 번의 낮은 값이 아니라 지속 추세로 판단합니다. "이끼가 죽었다" 같은 확정 표현은 사용하지 않으며, 성능 저하 가능성·점검 권장으로 안내합니다.</p>`;
}
function viewStats(){
  const u=usage(period.stats);
  return header('통계','사용 기록 및 공기질 추세')
    +`<div class="section-head"><h2>${u.label}</h2>${seg('stats')}</div>`
    +`<div class="grid cols-3">${metric('air','평균 PM2.5',{value:num(u.avgPm),unit:'µg/m³'})}${metric('gauge','평균 정화 효율',{value:num(u.avgEff),unit:'%'})}${metric('stats','총 작동 시간',{value:num(u.hours),unit:'시간'})}${metric('air','최고 PM2.5',{value:num(u.maxPm),unit:'µg/m³'})}${metric('air','최저 PM2.5',{value:num(u.minPm),unit:'µg/m³'})}${metric('water','물 사용량',{value:num(u.water),unit:'mL'})}</div>`
    +`<div class="card pad" style="margin-top:20px"><div style="font-size:13px;font-weight:700;margin-bottom:8px">PM2.5 배출 추세 <span style="font-weight:400;color:var(--faint);font-size:11.5px">(마우스 오버 시 상세값)</span></div>${trendChart(u.ser,{metric:'pmOut',color:'var(--accent)',unit:'µg/m³',period:u.period})}</div>`
    +`<div class="card pad" style="margin-top:16px"><div style="font-size:13px;font-weight:700;margin-bottom:8px">정화 효율 추세</div>${trendChart(u.ser,{metric:'eff',color:'var(--primary)',unit:'%',band:{min:30,max:45,lo:0,hi:60},period:u.period})}</div>`
    +`<p class="disclaimer">기록된 Demo 데이터를 동일한 정화효율 공식으로 계산합니다. 하드코딩된 값이 아닙니다.</p>`;
}
function viewSettings(){
  const connected=connection==='connected'||connection==='demo';
  const sw=(id,on)=>`<label class="switch"><input type="checkbox" data-set="${id}" ${on?'checked':''}><span class="tk"></span><span class="th"></span></label>`;
  return header('설정')
    +`<div class="section-head"><h2>제품 정보</h2></div><div class="card pad">
      <div class="row"><span class="k">제품 이름</span><input class="name" id="pname" value="${settings.productName}"></div>
      <div class="row"><span class="k">제품 ID</span><span class="v data">${settings.productId}</span></div>
      <div class="row"><span class="k">연결 상태</span>${badge(connected?'good':'replace',connLabel(connection))}</div>
      <div style="display:flex;gap:10px;margin-top:12px"><button class="btn ghost" data-conn="demo">연결(데모)</button><button class="btn ghost" data-conn="disconnected">연결 끊김 시뮬레이션</button></div></div>`
    +`<div class="section-head"><h2>모드</h2></div><div class="card pad"><div class="row"><span class="k">Demo Mode</span>${sw('demoMode',settings.demoMode)}</div><p class="disclaimer" style="margin-top:8px">실제 하드웨어가 없어 Demo Mode를 유지합니다.</p></div>`
    +`<div class="section-head"><h2>알림</h2></div><div class="card pad">
      <div class="row"><span class="k">알림 사용</span>${sw('notifications',settings.notifications)}</div>
      <div class="row"><span class="k">물 부족 알림</span>${sw('alertWater',settings.alertWater)}</div>
      <div class="row"><span class="k">필터 알림</span>${sw('alertFilter',settings.alertFilter)}</div>
      <div class="row"><span class="k">연결 끊김 알림</span>${sw('alertDisconnect',settings.alertDisconnect)}</div></div>`
    +`<div class="section-head"><h2>장치 제어</h2><span class="hint">데모 · 실제 신호 없음</span></div><div class="card pad"><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-ctl="팬">팬 제어</button><button class="btn ghost" data-ctl="펌프">펌프 제어</button><button class="btn ghost" data-ctl="LED">LED 제어</button></div><p class="disclaimer" id="ctl-note"></p></div>`
    +`<div class="section-head"><h2>데모 상태 테스트</h2></div><div class="card pad"><div class="row"><span class="k">센서 이상 시뮬레이션</span>${sw('sensorFault',sim.sensorFault)}</div><div class="row"><span class="k">물탱크 부족 시뮬레이션</span>${sw('waterLow',reading.waterLevel!=null&&reading.waterLevel<=THRESH.waterCrit)}</div></div>`
    +`<p class="disclaimer">설정은 이 브라우저에 저장됩니다. 카메라·이미지 분석 기능은 없습니다.</p>`;
}
function seg(key){ const opts=[['today','오늘'],['7d','7일'],['30d','30일']];
  return `<div class="seg">${opts.map(o=>`<button data-period="${key}:${o[0]}" aria-pressed="${period[key]===o[0]}">${o[1]}</button>`).join('')}</div>`; }

/* ---- 이벤트 ---- */
function bind(){
  document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{const[k,p]=b.dataset.period.split(':');period[k]=p;render();});
  document.querySelectorAll('[data-conn]').forEach(b=>b.onclick=()=>{connection=b.dataset.conn;lastUpdated=Date.now();render();});
  document.querySelectorAll('[data-ctl]').forEach(b=>b.onclick=()=>{const n=document.getElementById('ctl-note');if(n){n.style.color='var(--warning)';n.textContent=`데모 모드: "${b.dataset.ctl}" 제어 신호는 실제로 전송되지 않습니다.`;}});
  const pn=document.getElementById('pname'); if(pn) pn.onchange=()=>{settings.productName=pn.value;saveSettings();};
  document.querySelectorAll('[data-set]').forEach(b=>b.onchange=()=>{ const k=b.dataset.set;
    if(k==='sensorFault'){sim.sensorFault=b.checked; reading=sanitize(reading);}
    else if(k==='waterLow'){ reading={...reading, waterLevel:b.checked?10:76}; reading=sanitize({...reading,pm25In:reading.pm25In,pm25Out:reading.pm25Out}); }
    else { settings[k]=b.checked; saveSettings(); }
    render();
  });
  /* 그래프 hover — 시간/전단/후단/효율 상세값 */
  document.querySelectorAll('.chart2').forEach(c=>{
    const plot=c.querySelector('.c-plot'), tip=c.querySelector('.c-tip'), guide=c.querySelector('.c-guide');
    let pts=[]; try{ pts=JSON.parse(c.dataset.pts); }catch(e){ pts=[]; }
    if(!pts.length||!plot) return;
    const move=e=>{ const rect=plot.getBoundingClientRect(); let rel=(e.clientX-rect.left)/rect.width; rel=Math.max(0,Math.min(1,rel));
      const i=Math.round(rel*(pts.length-1)), p=pts[i], xp=(pts.length>1?i/(pts.length-1):0)*100;
      guide.style.left=xp+'%'; guide.style.display='block';
      tip.style.display='block'; tip.style.left=Math.max(12,Math.min(88,xp))+'%';
      tip.innerHTML=`<div class="tt">${p.tl}</div><div class="tr"><span>전단</span><b>${p.pmIn} µg/m³</b></div><div class="tr"><span>후단</span><b>${p.pmOut} µg/m³</b></div><div class="tr"><span>정화효율</span><b>${p.eff}%</b></div>`; };
    plot.addEventListener('mousemove',move);
    plot.addEventListener('mouseleave',()=>{ tip.style.display='none'; guide.style.display='none'; });
  });
}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{ current=b.dataset.nav;
  document.querySelectorAll('.navlink').forEach(n=>n.classList.toggle('active',n.dataset.nav===current)); render(); });

function loadSettings(){ const d={productName:'MOSS AIR',productId:'MOSS-001',demoMode:true,notifications:true,alertWater:true,alertFilter:true,alertDisconnect:true};
  try{const r=localStorage.getItem('moss_air_web');return r?{...d,...JSON.parse(r)}:d;}catch(e){return d;} }
function saveSettings(){ try{localStorage.setItem('moss_air_web',JSON.stringify(settings));}catch(e){} }

/* ---- 실시간(3초) ---- */
setInterval(()=>{ if(connection==='disconnected')return; reading=step(reading); lastUpdated=Date.now();
  /* 대시보드만 실시간 갱신 → 공기/필터/통계에서 값이 읽는 중 출렁이거나 그래프 hover가 끊기지 않음 */
  if(current==='dashboard') render(); }, 3000);

render();
</script>
